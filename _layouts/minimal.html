<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="minimal-site">
    <header class="site-shell">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-brand" href="{{ '/' | relative_url }}">
          {{ site.first_name }} {{ site.last_name }}
        </a>

        <div class="site-nav-links">
          {%- assign nav_pages = site.pages | where: 'nav', true | sort: 'nav_order' -%}
          {%- for nav_page in nav_pages -%}
            <a class="site-nav-link{% if page.url == nav_page.url %} is-active{% endif %}" href="{{ nav_page.url | relative_url }}">
              {{ nav_page.title }}
            </a>
          {%- endfor -%}
        </div>
      </nav>
    </header>

    <main class="site-shell site-main">
      {{ content }}
    </main>

    <footer class="site-shell site-footer">
      <p>{{ site.footer_text_plain | default: site.description }}</p>
    </footer>
  </body>
</html>
